name: dolmenwood-beyond

# Data lives in Azure Cosmos DB — set COSMOS_ENDPOINT/COSMOS_KEY (plus
# AUTH_SECRET and the optional Blob/SignalR/Resend vars) in your shell or a
# compose .env file. There is no local database container; use the Cosmos DB
# Emulator or a dev Cosmos account.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    command: ["pnpm", "--filter", "@dolmenwood/web", "dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/public:/app/apps/web/public:ro
      - ./packages:/app/packages:ro
      - next_cache:/app/apps/web/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - COSMOS_ENDPOINT=${COSMOS_ENDPOINT:-}
      - COSMOS_KEY=${COSMOS_KEY:-}
      - AUTH_SECRET=${AUTH_SECRET:-dev-only-secret}
      - BLOB_CONNECTION_STRING=${BLOB_CONNECTION_STRING:-}
      - SIGNALR_CONNECTION_STRING=${SIGNALR_CONNECTION_STRING:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  next_cache:
