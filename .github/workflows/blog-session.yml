name: Publish Blog Post

on:
  # Auto-publish on every push to main that touches docs/blog/
  push:
    branches:
      - main
    paths:
      - 'docs/blog/**.md'

  # Manual trigger: publish a specific file (or re-publish with a status override)
  workflow_dispatch:
    inputs:
      post_file:
        description: 'Filename in docs/blog/ to publish (e.g. 2026-04-25-dev-log-1.md)'
        required: true
        type: string
      status_override:
        description: 'Override publish status (leave blank to use front matter value)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - draft
          - publish

jobs:
  # ── Step 1: Detect which blog files to publish ───────────────────────────────
  detect:
    name: Detect changed blog posts
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.detect.outputs.files }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can diff against the previous commit on push
          fetch-depth: 2

      - name: Detect files
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: use the specified file
            FILES='["docs/blog/${{ inputs.post_file }}"]'
            COUNT=1
          else
            # Push to main: find .md files added or modified in this commit
            # Exclude README.md and any non-.md files
            CHANGED=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'docs/blog/*.md' \
              | grep -v 'README' \
              | grep '\.md$' || true)

            if [ -z "$CHANGED" ]; then
              echo "No blog posts changed in this push."
              FILES='[]'
              COUNT=0
            else
              # Build JSON array
              FILES=$(echo "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
              COUNT=$(echo "$CHANGED" | grep -c '.' || true)
            fi
          fi

          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Detected $COUNT file(s): $FILES"

  # ── Step 2: Publish each detected file ───────────────────────────────────────
  publish:
    name: Publish "${{ matrix.post_file }}"
    needs: detect
    if: needs.detect.outputs.count > 0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # publish others even if one fails
      matrix:
        post_file: ${{ fromJson(needs.detect.outputs.files) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse and convert post
        id: post
        env:
          POST_FILE: ${{ matrix.post_file }}
          STATUS_OVERRIDE: ${{ inputs.status_override }}
        run: |
          if [ ! -f "$POST_FILE" ]; then
            echo "::error::Post file not found: $POST_FILE"
            exit 1
          fi

          node << 'JSEOF'
          const fs = require('fs');
          const path = require('path');

          const raw = fs.readFileSync(process.env.POST_FILE, 'utf8');

          const fmMatch = raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
          if (!fmMatch) { console.error('No front matter found'); process.exit(1); }

          const fmLines = fmMatch[1].split('\n');
          const fm = {};
          fmLines.forEach(line => {
            const m = line.match(/^(\w+):\s*(.+)$/);
            if (m) fm[m[1]] = m[2].replace(/^["']|["']$/g, '').trim();
          });

          const tagsMatch = fmMatch[1].match(/tags:\s*\[([^\]]*)\]/);
          const tags = tagsMatch ? tagsMatch[1].split(',').map(t => t.trim().replace(/^["']|["']$/g, '')) : [];

          let body = fmMatch[2];
          body = body.replace(/^#[^#].*\n/, '');

          // Collect local image refs so the upload step can push them to WordPress
          const imageRefs = [];
          const imgRefPattern = /!\[([^\]]*)\]\(([^)]+)\)/g;
          let imgRefMatch;
          while ((imgRefMatch = imgRefPattern.exec(body)) !== null) {
            const imgPath = imgRefMatch[2];
            if (!imgPath.startsWith('http://') && !imgPath.startsWith('https://')) {
              imageRefs.push({ alt: imgRefMatch[1], path: imgPath });
            }
          }

          const html = body
            .replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) =>
              `<pre><code${lang ? ` class="language-${lang}"` : ''}>${code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`)
            .replace(/`([^`]+)`/g, (_, code) =>
              `<code>${code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\[/g,'&#91;').replace(/\]/g,'&#93;')}</code>`)
            .replace(/^\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n)+)/gm, (_, header, rows) => {
              const ths = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
              const trs = rows.trim().split('\n').map(row => {
                const tds = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
                return `<tr>${tds}</tr>`;
              }).join('');
              return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>\n`;
            })
            .replace(/^### (.+)$/gm, '<h3>$1</h3>')
            .replace(/^## (.+)$/gm, '<h2>$1</h2>')
            .replace(/^# (.+)$/gm, '<h4>$1</h4>')
            .replace(/^---$/gm, '<hr>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, imgPath) =>
              `<img src="${imgPath}" alt="${alt.replace(/"/g, '&quot;')}" style="max-width:100%;height:auto;" />`)
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
            .replace(/((?:^- .+\n?)+)/gm, (block) => {
              const items = block.trim().split('\n').map(l => `<li>${l.replace(/^- /, '')}</li>`).join('');
              return `<ul>${items}</ul>\n`;
            })
            .split(/\n{2,}/)
            .map(block => {
              block = block.trim();
              if (!block) return '';
              if (/^<(h[2-4]|ul|ol|li|table|pre|hr|blockquote)/.test(block)) return block;
              return `<p>${block.replace(/\n/g, ' ')}</p>`;
            })
            .join('\n');

          const statusOverride = process.env.STATUS_OVERRIDE;
          const status = statusOverride && statusOverride !== '' ? statusOverride : (fm.status || 'draft');

          const outputs = process.env.GITHUB_OUTPUT;
          const append = (k, v) => fs.appendFileSync(outputs, `${k}=${v}\n`);
          append('title', fm.title || path.basename(process.env.POST_FILE, '.md'));
          append('status', status);
          append('excerpt', (fm.excerpt || '').replace(/\n/g, ' ').trim());
          fs.appendFileSync(outputs, `tags<<EOF\n${JSON.stringify(tags)}\nEOF\n`);
          fs.appendFileSync(outputs, `content<<HTMLEOF\n${html}\nHTMLEOF\n`);

          append('has_images', String(imageRefs.length > 0));
          fs.appendFileSync(outputs, `image_refs<<REFSEOF\n${JSON.stringify(imageRefs)}\nREFSEOF\n`);
          console.log(`Title:  ${fm.title}`);
          console.log(`Status: ${status}`);
          console.log(`Tags:   ${tags.join(', ')}`);
          console.log(`Images: ${imageRefs.length}`);
          JSEOF

      - name: Upload images to WordPress
        id: upload_images
        if: steps.post.outputs.has_images == 'true'
        env:
          WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}
          WP_API_TOKEN: ${{ secrets.WP_API_TOKEN }}
          POST_FILE: ${{ matrix.post_file }}
          IMAGE_REFS: ${{ steps.post.outputs.image_refs }}
          HTML_CONTENT: ${{ steps.post.outputs.content }}
        run: |
          node << 'JSEOF'
          const fs = require('fs');
          const path = require('path');

          const base = process.env.WORDPRESS_API_URL;
          const token = 'Bearer ' + process.env.WP_API_TOKEN;
          const postDir = path.dirname(process.env.POST_FILE);
          const imageRefs = JSON.parse(process.env.IMAGE_REFS || '[]');
          let html = process.env.HTML_CONTENT;

          const MIME_TYPES = {
            '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg',
            '.png': 'image/png', '.gif': 'image/gif', '.webp': 'image/webp',
          };

          async function uploadImage(imgRef) {
            const localPath = path.resolve(postDir, imgRef.path);
            if (!fs.existsSync(localPath)) {
              console.warn(`Image not found, skipping: ${localPath}`);
              return null;
            }
            const ext = path.extname(localPath).toLowerCase();
            const mimeType = MIME_TYPES[ext] || 'application/octet-stream';
            const filename = path.basename(localPath);
            const fileBuffer = fs.readFileSync(localPath);

            try {
              const response = await fetch(`${base}/media`, {
                method: 'POST',
                headers: {
                  'Authorization': token,
                  'Content-Disposition': `attachment; filename="${filename}"`,
                  'Content-Type': mimeType,
                },
                body: fileBuffer,
              });
              const data = await response.json();
              if (data.source_url) {
                console.log(`Uploaded ${filename} → ${data.source_url}`);
                return { path: imgRef.path, url: data.source_url };
              }
              console.error(`Upload failed for ${filename}:`, JSON.stringify(data).substring(0, 200));
              return null;
            } catch (err) {
              console.error(`Error uploading ${filename}:`, err.message);
              return null;
            }
          }

          async function main() {
            let updatedHtml = html;
            for (const imgRef of imageRefs) {
              const result = await uploadImage(imgRef);
              if (result) {
                // Replace every occurrence of the local path with the WordPress URL
                updatedHtml = updatedHtml.split(`src="${imgRef.path}"`).join(`src="${result.url}"`);
              }
            }
            const outputs = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(outputs, `content<<HTMLEOF\n${updatedHtml}\nHTMLEOF\n`);
            console.log('Image upload complete.');
          }

          main().catch(err => { console.error('Fatal error:', err); process.exit(1); });
          JSEOF

      - name: Resolve tag IDs
        id: resolve_tags
        env:
          WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}
          WP_API_TOKEN: ${{ secrets.WP_API_TOKEN }}
          POST_TAGS: ${{ steps.post.outputs.tags }}
        run: |
          TAG_IDS=$(node -e "
            const tags = JSON.parse(process.env.POST_TAGS || '[]');
            const base = process.env.WORDPRESS_API_URL;
            const token = 'Bearer ' + process.env.WP_API_TOKEN;

            async function resolveTag(slug) {
              try {
                const searchRes = await fetch(\`\${base}/tags?search=\${encodeURIComponent(slug)}&per_page=10\`, {
                  headers: { Authorization: token }
                });
                const matches = await searchRes.json();
                if (Array.isArray(matches)) {
                  const existing = matches.find(t => t.slug === slug || t.name.toLowerCase() === slug.toLowerCase());
                  if (existing?.id) return existing.id;
                }
                const createRes = await fetch(\`\${base}/tags\`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: token },
                  body: JSON.stringify({ name: slug, slug })
                });
                const created = await createRes.json();
                if (created?.id) return created.id;
                console.error('Failed to resolve tag:', slug, JSON.stringify(created));
                return null;
              } catch (err) {
                console.error('Error resolving tag:', slug, err.message);
                return null;
              }
            }

            Promise.all(tags.map(resolveTag)).then(ids => {
              const valid = ids.filter(id => id !== null && Number.isInteger(id));
              console.log(JSON.stringify(valid));
            });
          ")
          echo "tag_ids=$TAG_IDS" >> $GITHUB_OUTPUT

      - name: Publish to WordPress
        id: publish
        env:
          WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}
          WP_API_TOKEN: ${{ secrets.WP_API_TOKEN }}
          POST_TITLE: ${{ steps.post.outputs.title }}
          POST_CONTENT: ${{ steps.upload_images.outputs.content != '' && steps.upload_images.outputs.content || steps.post.outputs.content }}
          POST_STATUS: ${{ steps.post.outputs.status }}
          POST_EXCERPT: ${{ steps.post.outputs.excerpt }}
          POST_TAGS: ${{ steps.resolve_tags.outputs.tag_ids }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${WORDPRESS_API_URL}/posts" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WP_API_TOKEN}" \
            -d "$(node -e "
              const title = process.env.POST_TITLE;
              const content = process.env.POST_CONTENT;
              const status = process.env.POST_STATUS;
              const excerpt = process.env.POST_EXCERPT;
              const tags = JSON.parse(process.env.POST_TAGS || '[]');
              console.log(JSON.stringify({ title, content, status, excerpt, tags }));
            ")")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            POST_URL=$(echo "$BODY" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).link||'')}catch{console.log('')}})")
            POST_ID=$(echo "$BODY"  | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch{console.log('')}})")
            echo "post_url=$POST_URL" >> $GITHUB_OUTPUT
            echo "post_id=$POST_ID"   >> $GITHUB_OUTPUT
            echo "✅ Published post ID $POST_ID — $POST_URL"
          else
            echo "::error::WordPress API returned $HTTP_CODE: $BODY"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### ✅ Blog Post Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Title | ${{ steps.post.outputs.title }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.post.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Post ID | ${{ steps.publish.outputs.post_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.publish.outputs.post_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Source file | ${{ matrix.post_file }} |" >> $GITHUB_STEP_SUMMARY