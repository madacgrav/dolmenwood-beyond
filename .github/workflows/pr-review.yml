name: PR Review Agents

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The four reviewer jobs share the composite action in
# .github/actions/agent-review (gather diff → run agent → post comment).
# They stay separate jobs (rather than a matrix) so the consolidation
# summary keeps a per-agent status row. Sleeps stagger the model calls
# to avoid rate limiting.
jobs:
  developer-architect:
    name: 🏗️ Developer Architect Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/agent-review
        with:
          agent-name: developer-architect
          agent-file: .github/agents/developer-architect-review.agent.md
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  devops:
    name: 🚀 DevOps Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/agent-review
        with:
          agent-name: devops
          agent-file: .github/agents/devops-review.agent.md
          sleep: '20'
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  security:
    name: 🔒 Security Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/agent-review
        with:
          agent-name: security
          agent-file: .github/agents/security-reviewer.agent.md
          sleep: '40'
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  qa:
    name: 🧪 QA Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/agent-review
        with:
          agent-name: qa
          agent-file: .github/agents/qa-reviewer.agent.md
          sleep: '60'
          github-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  consolidate:
    name: 📋 Consolidate Reviews
    runs-on: ubuntu-latest
    needs: [developer-architect, devops, security, qa]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Post consolidation summary
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RESULT: ${{ needs.developer-architect.result }}
          DEVOPS_RESULT: ${{ needs.devops.result }}
          SEC_RESULT: ${{ needs.security.result }}
          QA_RESULT: ${{ needs.qa.result }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}

          status_icon() {
            case $1 in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }

          # Build body into a temp file to avoid pipe-character YAML issues
          {
            echo "## 🤖 Automated Review Complete"
            echo ""
            echo "| Agent | Status |"
            echo "|-------|--------|"
            echo "| 🏗️ Developer Architect | $(status_icon $DEV_RESULT) ${DEV_RESULT} |"
            echo "| 🚀 DevOps | $(status_icon $DEVOPS_RESULT) ${DEVOPS_RESULT} |"
            echo "| 🔒 Security | $(status_icon $SEC_RESULT) ${SEC_RESULT} |"
            echo "| 🧪 QA | $(status_icon $QA_RESULT) ${QA_RESULT} |"
            echo ""
            echo "Review the individual agent comments above and address the feedback."
          } > summary.md

          gh pr comment $PR_NUM --repo ${{ github.repository }} --body-file summary.md

      - uses: actions/download-artifact@v4
        with:
          pattern: findings-*
          path: findings
          merge-multiple: true

      - name: Post consolidated review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls findings/*.json >/dev/null 2>&1; then
            node .github/scripts/synthesize-findings.mjs findings > consolidated.md
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file consolidated.md
          else
            echo "No findings artifacts to consolidate."
          fi
