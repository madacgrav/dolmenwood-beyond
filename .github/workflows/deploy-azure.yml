name: Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: dolmenwood-beyond-rg
  ACR_IMAGE_NAME: dolmenwood-web
  AZURE_ACR_NAME: dolmenwoodprodacr
  APP_SERVICE_NAME: dolmenwood-prod-web

jobs:
  # ---- On PRs: Bicep what-if only ----
  bicep-whatif:
    name: Bicep What-If (Preview)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep What-If
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/azure/main.bicep
          parameters: >
            infra/azure/main.bicepparam
            supabaseUrl=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          deploymentMode: Incremental
          additionalArguments: --what-if
          failOnStdErr: false

  # ---- On push/dispatch: CI gate, then build + migrate in parallel, then deploy ----
  ci:
    name: CI Checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-infra:
    name: Deploy Azure Infrastructure
    runs-on: ubuntu-latest
    needs: [ci]
    outputs:
      acr-login-server: ${{ steps.bicep.outputs.acrLoginServer }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (incremental — creates ACR if it does not exist)
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/azure/main.bicep
          parameters: >
            infra/azure/main.bicepparam
            imageTag=latest
            supabaseUrl=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          deploymentMode: Incremental
          failOnStdErr: false

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [deploy-infra]
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        run: az acr login --name "${{ env.AZURE_ACR_NAME }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ needs.deploy-infra.outputs.acr-login-server }}/${{ env.ACR_IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ needs.deploy-infra.outputs.acr-login-server }}/${{ env.ACR_IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=registry,ref=${{ needs.deploy-infra.outputs.acr-login-server }}/${{ env.ACR_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ needs.deploy-infra.outputs.acr-login-server }}/${{ env.ACR_IMAGE_NAME }}:cache,mode=max

  run-migrations:
    name: Run Supabase Migrations
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        run: |
          supabase db push --db-url "postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.${{ vars.SUPABASE_PROJECT_REF }}.supabase.co:5432/postgres"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-app:
    name: Update App Service Image
    runs-on: ubuntu-latest
    needs: [build-and-push, run-migrations, deploy-infra]
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update App Service container image
        run: |
          az webapp config container set \
            --name ${{ env.APP_SERVICE_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ needs.deploy-infra.outputs.acr-login-server }}/${{ env.ACR_IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ env.APP_SERVICE_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Health check
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.APP_SERVICE_NAME }}.azurewebsites.net/api/health)
            echo "Attempt $i/20 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed ✅"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 5 minutes"
          exit 1

